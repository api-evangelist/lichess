openapi: 3.2.0
info:
  version: 2.0.144
  title: Lichess.org API reference Simuls API
  contact:
    name: Lichess.org API
    url: https://lichess.org/api
    email: contact@lichess.org
  x-logo:
    url: https://lichess1.org/assets/logo/lichess-pad12.svg
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.txt
  description: '# Introduction

    Welcome to the reference for the Lichess API!'
servers:
- url: https://lichess.org
- url: https://lichess.dev
- url: http://localhost:{port}
  variables:
    port:
      default: '8080'
- url: http://l.org
tags:
- name: Simuls
  description: Access simuls played on Lichess.
paths:
  /api/simul:
    get:
      operationId: apiSimul
      summary: Get current simuls
      description: 'Get recently created, started, finished, simuls.

        Created and finished simul lists are not exhaustives, only those with

        strong enough host will be listed, the same filter is used to display simuls on https://lichess.org/simul.

        When authenticated with OAuth2, the pending list will be populated with your created, but unstarted simuls.'
      tags:
      - Simuls
      security: []
      responses:
        '200':
          description: The list of simuls.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                default: '''*'''
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items:
                      $ref: '#/components/schemas/Simul'
                  created:
                    type: array
                    items:
                      $ref: '#/components/schemas/Simul'
                  started:
                    type: array
                    items:
                      $ref: '#/components/schemas/Simul'
                  finished:
                    type: array
                    items:
                      $ref: '#/components/schemas/Simul'
              examples:
                default:
                  $ref: '#/components/examples/simuls-getCurrentSimuls.json'
components:
  schemas:
    PatronColor:
      type: integer
      description: 'Players can choose a color for their Patron wings.

        See [here for the color mappings](https://github.com/lichess-org/lila/blob/master/ui/lib/css/abstract/_patron-colors.scss).


        The presence of this field indicates the player is an active Patron.

        '
      minimum: 1
      maximum: 10
    LightUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        flair:
          $ref: '#/components/schemas/Flair'
        title:
          $ref: '#/components/schemas/Title'
        patron:
          $ref: '#/components/schemas/Patron'
        patronColor:
          $ref: '#/components/schemas/PatronColor'
      required:
      - id
      - name
    Patron:
      type: boolean
      deprecated: true
      description: 'Use patronColor value instead to determine if player is a patron.

        '
    VariantKey:
      type: string
      enum:
      - standard
      - chess960
      - crazyhouse
      - antichess
      - atomic
      - horde
      - kingOfTheHill
      - racingKings
      - threeCheck
      - fromPosition
      example: standard
      default: standard
    Simul:
      type: object
      required:
      - id
      - host
      - name
      - fullName
      - variants
      - isCreated
      - isFinished
      - isRunning
      - nbApplicants
      - nbPairings
      properties:
        id:
          type: string
        host:
          type: object
          allOf:
          - $ref: '#/components/schemas/LightUser'
          - type: object
            properties:
              rating:
                type: integer
              provisional:
                type: boolean
              gameId:
                type: string
              online:
                type: boolean
        name:
          type: string
        fullName:
          type: string
        variants:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/VariantKey'
              icon:
                type: string
              name:
                type: string
        isCreated:
          type: boolean
        isFinished:
          type: boolean
        isRunning:
          type: boolean
        text:
          type: string
        estimatedStartAt:
          type: integer
        startedAt:
          type: integer
        finishedAt:
          type: integer
        nbApplicants:
          type: integer
        nbPairings:
          type: integer
    Title:
      type: string
      enum:
      - GM
      - WGM
      - IM
      - WIM
      - FM
      - WFM
      - NM
      - CM
      - WCM
      - WNM
      - LM
      - BOT
      description: only appears if the user is a titled player or a bot user
    Flair:
      type: string
      description: See [available flair list and images](https://github.com/lichess-org/lila/tree/master/public/flair)
